<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package Squad · Birthdays / Cumpleaños</title>
<meta name="theme-color" content="#45437b">
<style>
  :root {
    --bg: #f7f7fb;
    --ink: #171721;
    --soft: #686879;
    --line: #dbdbe7;
    --accent: #45437b;
    --u: min(1vw, 1.78vh); /* unidad que mantiene proporcion 16:9 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); cursor: none;
    font-family: "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif; }
  body { background: radial-gradient(ellipse at 85% 35%, #e9e9f4 0%, transparent 60%), linear-gradient(135deg, #fff, var(--bg)); }
  body::before { content: ''; position: fixed; inset: 0 0 auto; height: calc(var(--u) * .45); background: var(--accent); }
  body::after { content: ''; position: fixed; right: calc(var(--u) * -11); bottom: calc(var(--u) * -18); width: calc(var(--u) * 48); height: calc(var(--u) * 48); border: calc(var(--u) * 4) solid #45437b05; transform: rotate(-35deg); pointer-events: none; }

  .frame { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: calc(var(--u) * 3) calc(var(--u) * 4.5); }

  header, footer { display: flex; justify-content: space-between; align-items: baseline;
    font-size: calc(var(--u) * 1.35); letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
  header { align-items: center; gap: calc(var(--u) * 3); padding-bottom: calc(var(--u) * 1.2); border-bottom: 1px solid var(--line); }
  footer { padding-top: calc(var(--u) * 1.6); border-top: 1px solid var(--line); }
  header b { color: var(--ink); font-weight: 600; }
  .brand { display: flex; align-items: center; gap: calc(var(--u) * 1.6); flex-shrink: 0; }
  .brand img { display: block; width: calc(var(--u) * 8.5); height: calc(var(--u) * 7.5); object-fit: contain; }
  .brand-copy { display: grid; gap: calc(var(--u) * .65); }
  .brand-copy b { font-size: calc(var(--u) * 1.4); letter-spacing: .18em; }
  .brand-copy span { font-size: calc(var(--u) * .72); letter-spacing: .12em; color: var(--accent); }
  .month-heading { display: grid; gap: calc(var(--u) * .65); text-align: right; }
  .month-heading b { color: var(--accent); font-size: calc(var(--u) * 1.4); }
  .month-heading span { font-size: calc(var(--u) * 1.1); letter-spacing: .12em; }

  main { position: relative; }
  .slide { position: absolute; inset: 0; display: grid; align-items: center; opacity: 0; transition: opacity 1.2s ease; }
  .slide.on { opacity: 1; }

  /* Persona */
  .person { grid-template-columns: auto 1fr; gap: calc(var(--u) * 6); justify-content: center; padding: 0 calc(var(--u) * 4); }
  .photo { width: calc(var(--u) * 25); height: calc(var(--u) * 31); border-radius: calc(var(--u) * .7); overflow: hidden; background: #e4e4ef;
    display: grid; place-items: center; font-size: calc(var(--u) * 7); font-weight: 300; color: var(--accent); border: 1px solid #45437b17; box-shadow: 0 calc(var(--u) * 1.1) calc(var(--u) * 3) #30305b13; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block; }
  .info { max-width: calc(var(--u) * 50); }
  .label { font-size: calc(var(--u) * 1.45); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .name { font-size: calc(var(--u) * 5.4); font-weight: 600; line-height: 1.06; letter-spacing: -.015em; margin: calc(var(--u) * 1.4) 0 calc(var(--u) * 1.8); text-wrap: balance; }
  .name.long { font-size: calc(var(--u) * 4.3); }
  .rule { width: calc(var(--u) * 5); height: 2px; background: var(--accent); margin-bottom: calc(var(--u) * 1.8); }
  .date { font-size: calc(var(--u) * 2.3); font-weight: 400; }
  .date span, .when span { color: var(--soft); }
  .when { font-size: calc(var(--u) * 1.6); margin-top: calc(var(--u) * .8); color: var(--soft); }
  .when.today { color: var(--accent); font-weight: 600; }
  .when.today span { color: var(--accent); }
  .wish { margin-top: calc(var(--u) * 2.5); padding-left: calc(var(--u) * 1.2); border-left: calc(var(--u) * .2) solid #9c9abd; font-size: calc(var(--u) * 1.7); line-height: 1.45; font-weight: 400; color: var(--accent); }
  .wish span { display: block; color: var(--soft); }

  /* Todos */
  .group { align-items: stretch; }
  .group h2 { font-size: calc(var(--u) * 2.6); font-weight: 600; letter-spacing: -.01em; }
  .group h2 span { color: var(--soft); font-weight: 300; }
  .list { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 1.5) calc(var(--u) * 3); align-content: center; height: 100%; }
  .list.many { grid-template-columns: repeat(4, 1fr); }
  .row { display: flex; align-items: center; gap: calc(var(--u) * 1.4); min-width: 0; }
  .row .ph { flex: none; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); border-radius: calc(var(--u) * .4); overflow: hidden; background: #e4e4ef;
    display: grid; place-items: center; font-size: calc(var(--u) * 1.8); color: var(--soft); }
  .row .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  .row .n { font-size: calc(var(--u) * 1.6); font-weight: 500; line-height: 1.2; }
  .row .d { font-size: calc(var(--u) * 1.3); color: var(--accent); margin-top: calc(var(--u) * .3); font-weight: 500; }
  .list.many .row .ph { width: calc(var(--u) * 4.8); height: calc(var(--u) * 4.8); }
  .list.many .row .n { font-size: calc(var(--u) * 1.35); }

  /* Mensaje */
  .message { place-items: center; text-align: center; }
  .message h2 { font-size: calc(var(--u) * 3.8); font-weight: 600; letter-spacing: -.015em; max-width: calc(var(--u) * 62); line-height: 1.15; text-wrap: balance; }
  .message .rule { margin: calc(var(--u) * 2.2) auto; }
  .message p { font-size: calc(var(--u) * 2.3); color: var(--soft); font-weight: 300; max-width: calc(var(--u) * 62); text-wrap: balance; }

  .bar { position: fixed; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; }
</style>
</head>
<body>
<div class="frame">
  <header><div class="brand"><img src="/assets/package-squad-logo.png" alt="Package Squad LLC"><div class="brand-copy"><b id="team">Package Squad</b><span>DRIVER APPRECIATION / GRACIAS, EQUIPO</span></div></div><div class="month-heading"><b id="tEn"></b><span id="tEs"></span></div></header>
  <main id="stage"></main>
  <footer><div id="dateEn"></div><div id="count"></div><div id="dateEs"></div></footer>
</div>
<div class="bar" id="bar"></div>

<script>
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WISHES = [
  ['Thank you for every mile and every delivery.', 'Gracias por cada milla y cada entrega.'],
  ['The whole team is glad you are part of it.', 'Todo el equipo se alegra de que seas parte de él.'],
  ['Wishing you a safe road and a great year ahead.', 'Te deseamos buen camino y un gran año por delante.'],
  ['This station is better with you on the team.', 'Esta estación es mejor contigo en el equipo.'],
];
const TEAM_NOTES = [
  ['Thank you, drivers. This team runs because of you.', 'Gracias, conductores. Este equipo funciona gracias a ustedes.'],
  ['Drive safe. Someone is waiting for you at home.', 'Maneja con cuidado. Alguien te espera en casa.'],
];

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');

let data = null, signature = '', slides = [], idx = -1, timer = null, noteIdx = 0;

function avatar(p) {
  return p.photo
    ? `<img src="${p.photo}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(initials(p.name))}'))">`
    : esc(initials(p.name));
}

function when(p, t) {
  const diff = p.day - t.day;
  if (diff === 0) return ['today', 'Today', 'Hoy'];
  if (diff === 1) return ['', 'Tomorrow', 'Mañana'];
  if (diff > 1) return ['', `In ${diff} days`, `En ${diff} días`];
  return ['', 'Celebrated this month', 'Lo celebramos este mes'];
}

function build() {
  const t = data.today, m = (data.month || t.month) - 1;
  $('tEn').textContent = `${MONTHS_EN[m]} Birthdays`;
  $('tEs').textContent = `Cumpleaños de ${MONTHS_ES[m]}`;
  $('team').textContent = data.team || '';
  const d = new Date(t.year, t.month - 1, t.day);
  $('dateEn').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  $('dateEs').textContent = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });

  const people = data.people, stage = $('stage');
  stage.innerHTML = '';
  slides = [];

  people.forEach((p, i) => {
    const [cls, en, es] = when(p, t);
    const w = WISHES[i % WISHES.length];
    const el = document.createElement('section');
    el.className = 'slide person';
    el.innerHTML = `
      <div class="photo">${avatar(p)}</div>
      <div class="info">
        <div class="label">Happy Birthday &nbsp;/&nbsp; Feliz Cumpleaños</div>
        <div class="name${p.name.length > 22 ? ' long' : ''}">${esc(p.name)}</div>
        <div class="rule"></div>
        <div class="date">${MONTHS_EN[m]} ${p.day} <span>&nbsp;/&nbsp; ${p.day} de ${MONTHS_ES[m]}</span></div>
        <div class="when ${cls}">${en} <span>&nbsp;/&nbsp; ${es}</span></div>
        <div class="wish">${esc(w[0])}<span>${esc(w[1])}</span></div>
      </div>`;
    stage.appendChild(el);
    slides.push({ el, label: `${i + 1} / ${people.length}`, secs: data.rotateSeconds || 10 });
  });

  if (people.length > 1) {
    const el = document.createElement('section');
    el.className = 'slide group';
    el.innerHTML = `
      <div class="list${people.length > 12 ? ' many' : ''}">${people.map((p) => `
        <div class="row"><div class="ph">${avatar(p)}</div><div><div class="n">${esc(p.name)}</div><div class="d">${MONTHS_EN[m].slice(0, 3)} ${p.day}</div></div></div>`).join('')}
      </div>`;
    stage.appendChild(el);
    slides.push({ el, label: '', secs: Math.max(12, data.rotateSeconds || 10) });
  }

  const el = document.createElement('section');
  el.className = 'slide message';
  el.innerHTML = '<div><h2></h2><div class="rule"></div><p></p></div>';
  stage.appendChild(el);
  slides.push({ el, label: '', note: true, empty: people.length === 0, secs: data.rotateSeconds || 10 });

  idx = -1;
  next();
}

function next() {
  clearTimeout(timer);
  idx = (idx + 1) % slides.length;
  const s = slides[idx];
  if (s.note) {
    const n = s.empty
      ? ['No birthdays on the list this month.', 'No hay cumpleaños en la lista este mes.']
      : TEAM_NOTES[noteIdx++ % TEAM_NOTES.length];
    s.el.querySelector('h2').textContent = n[0];
    s.el.querySelector('p').textContent = n[1];
  }
  slides.forEach((x) => x.el.classList.toggle('on', x === s));
  $('count').textContent = s.label;
  const bar = $('bar');
  bar.style.transition = 'none'; bar.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${s.secs}s linear`; bar.style.width = '100%'; }));
  timer = setTimeout(next, s.secs * 1000);
}

async function load() {
  try {
    const d = await (await fetch('/api/birthdays', { cache: 'no-store' })).json();
    const sig = JSON.stringify([d.people, d.month, d.today, d.team, d.rotateSeconds]);
    if (sig !== signature) { signature = sig; data = d; build(); }
  } catch (e) { /* se queda con lo que ya esta en pantalla */ }
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
